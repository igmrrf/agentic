<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture app</title><style>body{font:18px system-ui;margin:0;background:#f5f5f2;color:#20221f}main{max-width:680px;margin:48px auto;padding:24px}input,button,select{font:inherit}label{display:block;margin:16px 0 8px}button{margin-top:16px;padding:8px 16px}input{max-width:100%;box-sizing:border-box}ul{padding-left:24px}@media(max-width:600px){main{margin:0;padding:20px}}</style><main><h1>Jobs dashboard</h1><p>All jobs</p><ul id="jobs"></ul></main><script>fetch("/api/items").then(response=>response.json()).then(items=>{document.getElementById("jobs").replaceChildren(...items.map(item=>{const entry=document.createElement("li");entry.textContent=item.title+" — "+item.status;return entry}))}).catch(error=>{document.getElementById("jobs").textContent=error.message})</script></html>
