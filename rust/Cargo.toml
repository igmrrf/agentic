[package]
name = "rust-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Agentic Engineering Team"]
license = "MIT"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
# Deny by default; low-level crates/modules requiring unsafe must justify with // SAFETY: proof
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "warn"
static_mut_refs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
