# Rustfmt Configuration Standard (Rust 2024 Edition)
# Stable options adhering to the Rust 2024 Style Edition
edition = "2024"
style_edition = "2024"
max_width = 100
tab_spaces = 4
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
merge_derives = true
remove_nested_parens = true
match_block_trailing_comma = true
fn_params_layout = "Tall"
