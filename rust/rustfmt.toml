# Rustfmt Configuration Standard (Rust 2024 Edition)
edition = "2024"
style_edition = "2024"
max_width = 100
tab_spaces = 4
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
merge_derives = true
trailing_comma = "Vertical"
wrap_comments = true
comment_width = 100
normalize_doc_attributes = true
format_strings = true
