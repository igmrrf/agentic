name: Kotlin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ktlint Formatter Check
        run: ./gradlew ktlintCheck --continue

      - name: Detekt Static Analysis
        run: ./gradlew detekt

      - name: Run Test Suite
        run: ./gradlew test
