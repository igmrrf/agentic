name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Install Dependencies
        run: npm ci

      - name: Biome Linter & Formatter Check
        run: biome ci .

      - name: Strict Type Check
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test
